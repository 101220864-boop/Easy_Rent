<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EasyRent</title>
    <style>
        /* General Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7f6; display: flex; color: #333; }

        /* Sidebar - Simplified */
        .sidebar {
            width: 200px;
            height: 100vh;
            background: #333;
            color: white;
            padding: 20px;
            position: fixed;
        }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 30px; color: #28a745; }
        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .sidebar a:hover, .sidebar .active { background: #28a745; color: white; }

        /* Main Content */
        .main-content { margin-left: 200px; width: calc(100% - 200px); padding: 30px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Tables & Panels */
        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .panel h2 { font-size: 1.1rem; margin-bottom: 15px; border-left: 4px solid #28a745; padding-left: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { background: #f8f9fa; text-align: left; padding: 12px; border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; }

        /* Buttons */
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-add { background: #28a745; color: white; }
        .btn-delete { background: #dc3545; color: white; margin-left: 5px; }
        .btn-accept { background: #28a745; color: white; }
        .btn-reject { background: #6c757d; color: white; }

        /* Popup Form */
        .popup {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center;
        }
        .form-box { background: white; padding: 25px; border-radius: 8px; width: 350px; }
        .form-box input, .form-box select {
            width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>EasyRent Admin</h2>
        <a href="#" class="active">Dashboard</a>
        <a href="add_house.html">Add New House</a>
        <a href="browse.html">View Site</a>
        <a href="login.html" style="margin-top: 50px; color: #ff6b6b;">Logout</a>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>Control Panel</h1>
        </div>

        <section class="panel">
            <h2>Manage Houses</h2>
            <table>
                <thead>
                    <tr>
                        <th>House Name</th>
                        <th>Location</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="houseTable">
                    <tr>
                        <td>Modern Villa</td>
                        <td>Beirut</td>
                        <td>$800</td>
                        <td><button class="btn btn-delete" onclick="deleteRow(this)">Delete</button></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="panel">
            <h2>Rental Requests</h2>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>House</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Israa Dawood</td>
                        <td>Modern Villa</td>
                        <td style="color: orange;">Pending</td>
                        <td>
                            <button class="btn btn-accept">Accept</button>
                            <button class="btn btn-reject">Reject</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <div class="popup" id="popupForm">
        <div class="form-box">
            <h3>Add Property</h3>
            <input type="text" id="houseName" placeholder="Name">
            <input type="text" id="houseLocation" placeholder="Location">
            <input type="text" id="housePrice" placeholder="Price (e.g. $500)">
            <button class="btn btn-add" style="width: 100%;" onclick="addHouse()">Save House</button>
            <button class="btn" style="width: 100%; margin-top: 5px;" onclick="closeForm()">Cancel</button>
        </div>
    </div>

    <script>
        function openForm() { document.getElementById("popupForm").style.display = "flex"; }
        function closeForm() { document.getElementById("popupForm").style.display = "none"; }

        function addHouse() {
            let name = document.getElementById("houseName").value;
            let loc = document.getElementById("houseLocation").value;
            let price = document.getElementById("housePrice").value;

            if(!name || !loc || !price) return alert("Fill all fields");

            let row = document.getElementById("houseTable").insertRow();
            row.innerHTML = `<td>${name}</td><td>${loc}</td><td>${price}</td>
                             <td><button class="btn btn-delete" onclick="deleteRow(this)">Delete</button></td>`;
            
            closeForm();
        }

        function deleteRow(btn) { btn.parentElement.parentElement.remove(); }
    </script>
</body>
</html>
